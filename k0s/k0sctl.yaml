apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: lab-cluster
spec:
  hosts:
  - ssh:
      address: 192.168.10.10
      user: cloud
      port: 22
    role: controller
  - ssh:
      address: 192.168.10.11
      user: cloud
      port: 22
    role: worker
  k0s:
    version: v1.36.4+k0s.1
    versionChannel: stable
    dynamicConfig: false
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: lab-cluster
      spec:
        network:
          provider: calico
          kubeProxy:
            mode: ipvs
            ipvs:
              strictARP: true
        extensions:
          helm:
            charts:
              - name: flux-operator
                chartname: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
                namespace: flux-system
                version: "0.61.0"