services:
  bind9:
    image: internetsystemsconsortium/bind9:9.20
    container_name: bind9
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./config:/etc/bind
      - ./zones:/zones
      - ./cache:/var/cache/bind
    restart: unless-stopped
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "lab.riupie.com", "SOA", "+short"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
